<form id="member-form" class="membership-form" data-membership-form="member" aria-labelledby="member-heading" aria-describedby="member-intro" {{formAttributes}}>
  {{formNotice}}
  <!-- MEMBER PROGRAMS -->
  {{formPolicy}}
  <div class="membership-field">
    <label for="member-name">Фамилия и&nbsp;имя, отчество при&nbsp;наличии</label>
    <input id="member-name" name="name" type="text" autocomplete="name" maxlength="200" required aria-describedby="member-name-error">
    <p id="member-name-error" class="membership-error" data-field-error="name" hidden></p>
  </div>
  <div class="membership-field">
    <label for="member-company">Название компании</label>
    <input id="member-company" name="company" type="text" autocomplete="organization" maxlength="200" required aria-describedby="member-company-error">
    <p id="member-company-error" class="membership-error" data-field-error="company" hidden></p>
  </div>
  <div class="membership-field">
    <label for="member-phone">Телефон</label>
    <input id="member-phone" name="phone" type="tel" autocomplete="tel" maxlength="48" required aria-describedby="member-phone-error">
    <p id="member-phone-error" class="membership-error" data-field-error="phone" hidden></p>
  </div>
  <div class="membership-field">
    <label for="member-email">Электронная почта</label>
    <input id="member-email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required aria-describedby="member-email-error">
    <p id="member-email-error" class="membership-error" data-field-error="email" hidden></p>
  </div>
  <fieldset class="membership-programs" aria-describedby="member-connect-error">
    <legend>Как с&nbsp;вами удобнее связаться?</legend>
    <label><input type="radio" name="connect" value="Email" required aria-describedby="member-connect-error"><span>По&nbsp;почте</span></label>
    <label><input type="radio" name="connect" value="Telegram" required aria-describedby="member-connect-error"><span>В&nbsp;Telegram</span></label>
    <p id="member-connect-error" class="membership-error" data-field-error="connect" hidden></p>
  </fieldset>
  <fieldset class="membership-optional-group">
    <legend>Дополнительные сведения</legend>
    <div class="membership-extra-fields">
      <div class="membership-field">
        <label for="member-sphere">Сфера деятельности <span class="membership-optional">По&nbsp;желанию</span></label>
        <input id="member-sphere" name="sphere" type="text" maxlength="200">
      </div>
      <div class="membership-field">
        <label for="member-profession">Должность <span class="membership-optional">По&nbsp;желанию</span></label>
        <input id="member-profession" name="profession" type="text" autocomplete="organization-title" maxlength="200">
      </div>
      <div class="membership-field">
        <label for="member-recommendations">Кто может порекомендовать вас клубу? <span class="membership-optional">По&nbsp;желанию</span></label>
        <input id="member-recommendations" name="recommendations" type="text" maxlength="420">
      </div>
      <div class="membership-field">
        <label for="member-comment">Чего вы&nbsp;ждёте от&nbsp;участия в&nbsp;клубе? <span class="membership-optional">По&nbsp;желанию</span></label>
        <textarea id="member-comment" name="comment" rows="3" maxlength="2000"></textarea>
      </div>
    </div>
  </fieldset>
  {{agreements}}
  <div class="membership-send">
    <button class="membership-action" type="submit"{{submitState}}>Подать заявку</button>
    <p class="membership-result" data-application-result role="status" tabindex="-1"></p>
  </div>
</form>
