<fieldset class="site-theme" id="site-theme" data-site-theme tabindex="-1" hidden>
  <legend>Оформление<span class="theme-system-state" hidden></span></legend>
  <div class="site-theme-choices">
    <label><input type="radio" name="site-theme-choice" value="system" checked>Как в системе</label>
    <label><input type="radio" name="site-theme-choice" value="light">Светлая</label>
    <label><input type="radio" name="site-theme-choice" value="dark">Тёмная</label>
  </div>
</fieldset>
