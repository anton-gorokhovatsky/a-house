<fieldset class="site-theme" id="site-theme" data-site-theme tabindex="-1" hidden>
  <legend>{{themeLabel}}</legend>
  <div class="site-theme-choices">
    <label>
      <input type="radio" name="site-theme-choice" value="system" aria-labelledby="theme-system-label" aria-describedby="theme-system-state" checked>
      <span><span id="theme-system-label">Как в системе</span><small class="theme-system-state" id="theme-system-state" hidden></small></span>
    </label>
    <label><input type="radio" name="site-theme-choice" value="light">Светлая</label>
    <label><input type="radio" name="site-theme-choice" value="dark">Тёмная</label>
  </div>
</fieldset>
