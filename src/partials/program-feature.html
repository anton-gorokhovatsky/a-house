<article class="home-feature" {{attrs}}>
  <div id="rec619984956" class="home-feature-heading">
    <p class="home-meta">{{kind}} <span class="home-feature-date">{{date}}</span></p>
    <h3>{{title}}</h3>
  </div>
  <div class="home-feature-visit">
    <p class="home-feature-context">{{summary}}{{detail}}</p>
    <p class="home-feature-place">{{place}}</p>
    {{access}}
    <div class="home-feature-actions">
      {{booking}}
      <a class="home-feature-link" href="{{url}}">{{linkLabel}}</a>
    </div>
  </div>
  {{figure}}
</article>
