<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="referrer" content="{{REFERRER_POLICY}}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src {{CONNECT_SOURCE}}; object-src 'none'; form-action {{FORM_ACTION}}; base-uri 'none'">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  {{SHARE}}
  {{FAVICON}}
  <script src="{{THEME_SCRIPT}}"></script>
  {{STYLE}}
  {{SCRIPTS}}
</head>
<body class="t-body" data-page="{{SLUG}}">
  <a class="skip-content" href="#site-content">К содержанию</a>
  {{BODY}}
</body>
</html>
