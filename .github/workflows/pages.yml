name: Publish review site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    environment:
      name: github-pages
      deployment: false
    env:
      A_FRIEND_ORDER_URL: ${{ vars.A_FRIEND_ORDER_URL }}
      A_FRIEND_PERIOD: ${{ vars.A_FRIEND_PERIOD }}
      A_FRIEND_TERMS_URL: ${{ vars.A_FRIEND_TERMS_URL }}
      A_FRIEND_CONSENT_URL: ${{ vars.A_FRIEND_CONSENT_URL }}
      A_FRIEND_CONSENT_TEXT: ${{ vars.A_FRIEND_CONSENT_TEXT }}
      A_MEMBER_APPLICATION_URL: ${{ vars.A_MEMBER_APPLICATION_URL }}
      A_MEMBER_TERMS_URL: ${{ vars.A_MEMBER_TERMS_URL }}
      A_MEMBER_CONSENT_URL: ${{ vars.A_MEMBER_CONSENT_URL }}
      A_MEMBER_CONSENT_TEXT: ${{ vars.A_MEMBER_CONSENT_TEXT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm run check:browser
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
